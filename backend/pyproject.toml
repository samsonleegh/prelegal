[project]
name = "prelegal-backend"
version = "0.1.0"
description = "Prelegal backend API (FastAPI)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "litellm>=1.85.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
